name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vega-marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out marketplace
        uses: actions/checkout@v7
        with:
          path: vega-marketplace

      - name: Check out Vega
        uses: actions/checkout@v7
        with:
          repository: haneoka-gakuen/vega
          path: vega-marketplace/.dependencies/vega
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d

      - uses: pnpm/action-setup@v6
        with:
          version: 11.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vega-marketplace/pnpm-lock.yaml
      - name: Set up locked Vega Rust and WASM tools
        uses: ./vega-marketplace/.dependencies/vega/.github/actions/setup-wasm

      - name: Install dependencies
        working-directory: vega-marketplace
        run: pnpm install --no-frozen-lockfile

      - name: Build protocol and Vega
        working-directory: vega-marketplace
        run: |
          pnpm --filter @haneoka/vega-protocol build
          pnpm --filter @haneoka/vega build:core

      - name: Check marketplace
        working-directory: vega-marketplace
        run: pnpm check

      - name: Inspect package
        working-directory: vega-marketplace
        run: pnpm pack --dry-run
